[project]
name = "kasmap"
version = "0.1.0"
description = "KasMap — global location intelligence platform: data foundation, ingestion and analytics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "click>=8.1",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "duckdb>=1.1",
    "pyarrow>=15",
    "h3>=4.1",
    "shapely>=2.0",
    "httpx>=0.27",
    "structlog>=24.1",
]

[project.optional-dependencies]
osm = ["osmium>=3.7"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
kasmap = "kasmap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kasmap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
