name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install -e ".[dev]"
      - run: .venv/bin/ruff check src tests
      - run: .venv/bin/pytest -q

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build database image
        run: docker build -t kasmap/postgres infrastructure/postgres
      - name: Start database
        run: |
          docker run -d --name db -e POSTGRES_USER=kasmap -e POSTGRES_PASSWORD=kasmap \
            -e POSTGRES_DB=kasmap -p 5432:5432 kasmap/postgres
          for i in $(seq 1 30); do docker exec db pg_isready -U kasmap && break; sleep 2; done
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install -e ".[dev]"
      - name: Apply migrations and seed
        env:
          KASMAP_DATABASE_URL: postgresql://kasmap:kasmap@localhost:5432/kasmap
        run: |
          .venv/bin/kasmap db migrate
          .venv/bin/kasmap db seed
